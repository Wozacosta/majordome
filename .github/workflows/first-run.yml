name: First run

# Majordome only. Starts the app on a machine with no Claude and no notes, and
# walks what a new owner does: install Claude from the welcome page, start its
# sign-in, and (with an account) start notes and get a first answer.
# See docs/operations/first-run-tests.md.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      account:
        description: "Also ask signed-in Claude one question (uses the CLAUDE_CODE_OAUTH_TOKEN secret)"
        type: boolean
        default: true
  workflow_call:
    inputs:
      account:
        type: boolean
        default: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: first-run-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  first_run:
    name: First run (${{ matrix.os }})
    if: github.repository == 'Wozacosta/majordome'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Install the test browser
        run: node scripts/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium ffmpeg

      - name: Install Claude and start its sign-in
        run: vp run first-run first-run/claude-installs-and-sign-in-starts.e2e.ts

      # Run before the upload below, each on a home of its own: neither needs Claude.
      - name: Say who the owner is, with no assistant yet
        run: vp run first-run first-run/owner-says-who-they-are.e2e.ts

      - name: Start a first chat from the welcome page
        env:
          FIRST_RUN_REPLAY: "1"
        run: vp run first-run first-run/first-ask-starts-a-chat.e2e.ts

      - name: Upload the install run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: first-run-install-${{ matrix.os }}
          path: scripts/.e2e-first-run
          if-no-files-found: ignore
          retention-days: 7

      # One real question to the cheapest model, on the account whose token the
      # secret holds. Not on a push to main, and only on Linux: once is enough.
      - name: Check for the Claude account token
        id: account
        if: ${{ matrix.os == 'ubuntu-24.04' && (github.event_name == 'schedule' || inputs.account == true) }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set, so the first-answer test did not run."
          fi

      - name: Start notes and get a first answer
        if: ${{ steps.account.outputs.present == 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: vp run first-run first-run/signed-in-claude-answers.e2e.ts

      - name: Upload the first-answer run
        if: ${{ !cancelled() && steps.account.outputs.present == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: first-run-answer-${{ matrix.os }}
          # The repository is public and these pages belong to a real account,
          # so only the pass or fail summary leaves the runner.
          path: scripts/.e2e-first-run/summary.md
          if-no-files-found: ignore
          retention-days: 7
