name: Majordome site

# Publishes site/ (the landing page, plain files with no build step) to GitHub Pages.
on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/majordome-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majordome-site
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'Wozacosta/majordome'
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: site
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
