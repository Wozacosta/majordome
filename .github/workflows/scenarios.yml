name: Scenarios

# Majordome only. Runs upstream's web scenarios that pass on Majordome's screens:
# the real dev stack and a real browser, with the replay agent in place of a model.
# Nightly, not on a push: one run takes longer than CI. The list of scenarios left
# out is in scripts/majordome.e2e.config.ts. See docs/operations/scenarios.md.

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scenarios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenarios:
    name: Scenarios
    if: github.repository == 'Wozacosta/majordome'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Install the test browser
        run: node scripts/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium ffmpeg

      - name: Run the scenarios
        run: vp run scenarios --config majordome.e2e.config.ts --target web

      - name: Show the summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f scripts/.e2e/summary.md ]; then
            cat scripts/.e2e/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Traces, screenshots and videos of a failed run. Every page is fixture data.
      - name: Upload the failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenarios
          path: scripts/.e2e
          if-no-files-found: ignore
          retention-days: 7
