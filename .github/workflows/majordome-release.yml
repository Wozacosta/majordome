name: Majordome release

# Builds Majordome's macOS app for Apple silicon and Intel, signs and notarizes
# it, and publishes the DMGs with their update feed (latest-mac.yml) as a GitHub
# Release of this repository, which the installed app checks for updates.
# T3 Code's release.yml skips itself outside pingdotgg/t3code.
# See docs/operations/release.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.2.0. Tags v<version> on the selected commit."
        required: true
        type: string

concurrency:
  group: majordome-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    if: github.repository == 'Wozacosta/majordome'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - id: version
        name: Resolve version
        env:
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$RAW_VERSION' is not a version like 1.2.3 or 1.2.3-beta.1."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Without every signing secret the build is signed ad hoc and the release
      # stays a draft, so no installed app is offered an update it cannot apply.
      - id: signing
        name: Check signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          present=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -n "${!name}" ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" -eq 5 ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$present" -eq 0 ]]; then
            echo "::warning::No signing secrets: building ad hoc and keeping the release a draft."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set all of CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER, or none."
            exit 1
          fi

  # A version a new owner cannot set up is not published.
  first_run:
    name: First run
    needs: [preflight]
    uses: ./.github/workflows/first-run.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  build:
    name: macOS ${{ matrix.arch }}
    needs: [preflight]
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-apple-darwin
          # Intel is off while Majordome has one user, to halve the build. Put these two lines
          # back before going public: docs/whatsnext.md, "Before going live".
          # - arch: x64
          #   rust_target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...
          save-pnpm-store: ${{ matrix.arch == 'arm64' }}

      # The x64 server bytecode cache is generated by running x64 Node.
      - name: Ensure Rosetta
        if: matrix.arch == 'x64'
        run: /usr/bin/arch -x86_64 /usr/bin/true || sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      # electron-builder imports CSC_LINK into a temporary keychain and
      # notarizes with the App Store Connect API key.
      - name: Build DMG
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SIGNED: ${{ needs.preflight.outputs.signed }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          MAJORDOME_GOOGLE_CLIENT_ID: ${{ secrets.MAJORDOME_GOOGLE_CLIENT_ID }}
          MAJORDOME_GOOGLE_CLIENT_SECRET: ${{ secrets.MAJORDOME_GOOGLE_CLIENT_SECRET }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          args=(--platform mac --target dmg --arch "$ARCH" --build-version "$VERSION" --verbose)
          if [[ "$SIGNED" == "true" ]]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            (umask 077 && printf '%s' "$APPLE_API_KEY" > "$key_path")
            export APPLE_API_KEY="$key_path"
            args+=(--signed)
          fi
          vp run dist:desktop:artifact "${args[@]}"

      # electron-builder names both architectures' feed latest-mac.yml; the
      # release job merges them.
      - name: Collect release assets
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p release-publish
          cp release/*.dmg release/*.zip release/*.blockmap release-publish/
          manifest=latest-mac.yml
          if [[ "$ARCH" == "x64" ]]; then manifest=latest-mac-x64.yml; fi
          cp release/latest-mac.yml "release-publish/$manifest"
          ls -l release-publish

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-mac-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [preflight, build, first_run]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-mac-*
          merge-multiple: true
          path: release-assets

      # electron-updater reads one latest-mac.yml and picks the entry for its arch.
      - name: Merge the update feed
        run: |
          set -euo pipefail
          # Absent while the Intel build is off; the Apple silicon feed is then the whole feed.
          if [[ -f release-assets/latest-mac-x64.yml ]]; then
            node scripts/merge-update-manifests.ts --platform mac \
              release-assets/latest-mac.yml release-assets/latest-mac-x64.yml release-assets/latest-mac.yml
            rm release-assets/latest-mac-x64.yml
          fi
          cat release-assets/latest-mac.yml

      # The version's own section of CHANGELOG.md leads the release; empty when it has none.
      - name: Read what's new
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          awk -v heading="## $VERSION" '
            $0 == heading { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.preflight.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Majordome ${{ needs.preflight.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.prerelease }}
          draft: ${{ needs.preflight.outputs.signed != 'true' }}
          make_latest: ${{ needs.preflight.outputs.signed == 'true' && needs.preflight.outputs.prerelease != 'true' }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.blockmap
            release-assets/latest-mac.yml
          fail_on_unmatched_files: true
          token: ${{ github.token }}
